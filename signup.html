<!DOCTYPE html>
<html lang="en">
  <head>

      );
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Notes — Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-page:      #0e0e10;
        --bg-card:      #161618;
        --bg-input:     #1e1e22;

        --accent:       #00ff7f;
        --accent-glow:  rgba(0,255,127,0.55);
        --accent-dim:   rgba(0,255,127,0.1);

        --accent-purple:      #bf00ff;
        --accent-purple-glow: rgba(191,0,255,0.55);
        --accent-purple-dim:  rgba(191,0,255,0.1);

        --text-primary:  #f0f0f0;
        --text-secondary:#888;
        --text-muted:    #555;

        --radius: 10px;
        --transition: 0.2s ease;
        --page-border-color: #1fd670;

        /* Active theme vars — swapped by JS on mode change */
        --active-accent:      #00ff7f;
        --active-glow:        rgba(0,255,127,0.55);
        --active-glow-wide:   rgba(0,255,127,0.15);
        --active-glow-soft:   rgba(0,255,127,0.25);
        --active-accent-mid:  rgba(0,255,127,0.6);
        --active-dim:         rgba(0,255,127,0.1);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg-page);
        color: var(--text-primary);
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: 2px solid var(--page-border-color);
        outline-offset: -6px;
      }

      .card {
        background: var(--bg-card);
        border: 1.5px solid var(--active-accent);
        border-radius: var(--radius);
        padding: 40px 36px;
        width: min(420px, 90vw);
        display: flex;
        flex-direction: column;
        gap: 24px;
        box-shadow: 0 0 24px var(--active-glow), 0 0 60px var(--active-glow-wide), 0 0 80px rgba(0,0,0,0.6);
      }

      /* ── Header ── */
      .card-header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
      .card-header h1 {
        font-family: 'Syne', sans-serif;
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, var(--text-primary) 40%, var(--text-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .card-header p {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.04em;
      }

      /* ── Mode toggle tabs ── */
      .tabs {
        display: flex;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.07);
      }
      .tab {
        flex: 1;
        padding: 10px;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        background: transparent;
        color: var(--text-muted);
        border: none;
        transition: background var(--transition), color var(--transition);
      }
      .tab.active {
        background: var(--active-dim);
        color: var(--active-accent);
        text-shadow: 0 0 8px var(--active-glow);
      }
      .tab:not(.active):hover { color: var(--text-secondary); }

      /* ── Fields ── */
      .fields { display: flex; flex-direction: column; gap: 14px; }

      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .field input {
        background: var(--bg-input);
        color: var(--text-primary);
        border: 1.5px solid var(--active-accent-mid);
        box-shadow: 0 0 6px var(--active-glow-soft);
        border-radius: var(--radius);
        padding: 12px 16px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        outline: none;
        transition: border-color var(--transition), box-shadow var(--transition);
        width: 100%;
      }
      .field input::placeholder { color: var(--text-muted); }
      .field input:focus {
        border-color: var(--active-accent);
        box-shadow: 0 0 14px var(--active-glow), 0 0 3px var(--active-accent);
      }

      /* ── Submit button ── */
      .btn-submit {
        width: 100%;
        background: var(--active-accent);
        color: #0e0e10;
        border: none;
        border-radius: var(--radius);
        padding: 13px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 14px var(--active-glow);
        transition: filter var(--transition), transform var(--transition);
      }
      .btn-submit:hover { filter: brightness(1.15); transform: translateY(-1px); }
      .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      /* ── Messages ── */
      .message {
        display: none;
        font-size: 12px;
        letter-spacing: 0.04em;
        padding: 12px 14px;
        border-radius: calc(var(--radius) - 2px);
        text-align: center;
      }
      .message.success {
        display: block;
        background: rgba(31,214,112,0.1);
        border: 1px solid rgba(31,214,112,0.35);
        color: #1fd670;
      }
      .message.error {
        display: block;
        background: rgba(255,26,60,0.1);
        border: 1px solid rgba(255,26,60,0.35);
        color: #ff1a3c;
      }

      /* ── Footer ── */
      .card-footer {
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
      }
      .card-footer a {
        color: var(--active-accent);
        text-decoration: none;
        text-shadow: 0 0 6px var(--active-glow-soft);
        transition: opacity var(--transition);
      }
      .card-footer a:hover { opacity: 0.75; }
    </style>
    <script>
      (function () {
        const vivid = [
          [0,100,55],[20,100,55],[40,100,50],[75,100,45],[120,100,45],
          [160,100,48],[185,100,50],[210,100,58],[240,100,62],[270,100,60],
          [300,100,55],[330,100,55],
        ];
        const [h, s, l] = vivid[Math.floor(Math.random() * vivid.length)];
        document.documentElement.style.setProperty('--page-border-color', `hsl(${h},${s}%,${l}%)`);
      })();
    </script>
  </head>
  <body>

    <div class="card">

      <div class="card-header">
        <h1>My Notes</h1>
        <p id="card-subtitle">Create an account to get started</p>
      </div>

      <!-- Sign up / Log in toggle -->
      <div class="tabs">
        <button class="tab active" id="tab-signup">Sign Up</button>
        <button class="tab" id="tab-login">Log In</button>
      </div>

      <div class="fields">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Min. 6 characters" />
        </div>
      </div>

      <div id="message" class="message"></div>

      <button class="btn-submit" id="submit-btn">Sign Up</button>

      <div class="card-footer">
        <span id="footer-text">Already have an account?</span>
        <a href="#" id="footer-link">Log in instead</a>
      </div>

    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const emailInput  = document.getElementById('email');
        const passInput   = document.getElementById('password');
        const submitBtn   = document.getElementById('submit-btn');
        const message     = document.getElementById('message');
        const tabSignup   = document.getElementById('tab-signup');
        const tabLogin    = document.getElementById('tab-login');
        const subtitle    = document.getElementById('card-subtitle');
        const footerText  = document.getElementById('footer-text');
        const footerLink  = document.getElementById('footer-link');

        let mode = 'signup'; // 'signup' | 'login'

        const root = document.documentElement;

        function applyTheme(theme) {
          if (theme === 'green') {
            root.style.setProperty('--active-accent',     '#00ff7f');
            root.style.setProperty('--active-glow',       'rgba(0,255,127,0.55)');
            root.style.setProperty('--active-glow-wide',  'rgba(0,255,127,0.15)');
            root.style.setProperty('--active-glow-soft',  'rgba(0,255,127,0.25)');
            root.style.setProperty('--active-accent-mid', 'rgba(0,255,127,0.6)');
            root.style.setProperty('--active-dim',        'rgba(0,255,127,0.1)');
            submitBtn.style.background = '#00ff7f';
          } else {
            root.style.setProperty('--active-accent',     '#bf00ff');
            root.style.setProperty('--active-glow',       'rgba(191,0,255,0.55)');
            root.style.setProperty('--active-glow-wide',  'rgba(191,0,255,0.15)');
            root.style.setProperty('--active-glow-soft',  'rgba(191,0,255,0.25)');
            root.style.setProperty('--active-accent-mid', 'rgba(191,0,255,0.6)');
            root.style.setProperty('--active-dim',        'rgba(191,0,255,0.1)');
            submitBtn.style.background = '#bf00ff';
          }
        }

        function setMode(newMode) {
          mode = newMode;
          message.className = 'message';
          emailInput.value  = '';
          passInput.value   = '';

          if (mode === 'signup') {
            applyTheme('green');
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
            subtitle.textContent    = 'Create an account to get started';
            submitBtn.textContent   = 'Sign Up';
            footerText.textContent  = 'Already have an account? ';
            footerLink.textContent  = 'Log in instead';
          } else {
            applyTheme('purple');
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
            subtitle.textContent    = 'Welcome back';
            submitBtn.textContent   = 'Log In';
            footerText.textContent  = "Don't have an account? ";
            footerLink.textContent  = 'Sign up instead';
          }
        }

        tabSignup.addEventListener('click', () => setMode('signup'));
        tabLogin.addEventListener('click',  () => setMode('login'));
        footerLink.addEventListener('click', (e) => {
          e.preventDefault();
          setMode(mode === 'signup' ? 'login' : 'signup');
        });

        function showMessage(text, type) {
          message.textContent = text;
          message.className   = `message ${type}`;
        }

        submitBtn.addEventListener('click', async () => {
          const email    = emailInput.value.trim();
          const password = passInput.value;

          if (!email || !password) {
            showMessage('Please fill in both fields.', 'error');
            return;
          }
          if (password.length < 6) {
            showMessage('Password must be at least 6 characters.', 'error');
            return;
          }

          submitBtn.disabled    = true;
          submitBtn.textContent = mode === 'signup' ? 'Signing up…' : 'Logging in…';

          if (mode === 'signup') {
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
              showMessage(error.message, 'error');
              submitBtn.disabled    = false;
              submitBtn.textContent = 'Sign Up';
            } else {
              showMessage('Account created! Redirecting…', 'success');
              setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            }

          } else {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
              showMessage(error.message, 'error');
              submitBtn.disabled    = false;
              submitBtn.textContent = 'Log In';
            } else {
              showMessage('Logged in! Redirecting…', 'success');
              setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            }
          }
        });

        [emailInput, passInput].forEach(el => {
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitBtn.click();
          });
        });
      });
    </script>

  </body>
</html>
